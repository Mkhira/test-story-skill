appId: {{APP_ID}}
---
# {{TC-ID}} – {{title}} · covers {{AC}} · generated by test-story; run flow_sync.py stamp after editing
- runFlow: subflows/go-to-feature.yaml
# Step 1 – {{step}}
- tapOn:
    id: "{{testID}}"
- inputText: ${{{DATA_KEY}}}
# Step 2 – {{step with expected result}}
- tapOn:
    id: "{{testID}}"
# The expected result. label "EXPECT …" = this case's check: a failure here is deterministic and
# is not retried. timeout 5000 for local UI / validation, 15000 right after a server call.
- extendedWaitUntil:
    visible: "${LANG_CODE == 'ar' ? '{{ar text}}' : '{{en text}}'}"
    timeout: 5000
    label: "EXPECT step2: {{short expected result}}"
- takeScreenshot: {{TC-ID}}_step2
